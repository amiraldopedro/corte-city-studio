<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corte City Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root{
  --noite:#0A0A0F; --grafite:#14141B; --placa:#1C1C25; --placa2:#24242F; --linha:#2B2B37;
  --texto:#F3F3F6; --apagado:#8F8FA0; --corte:#FF3B4E; --ac:#C8FF2E; --ac-tinta:#0A0A0F;
  --ok:#3DDC84; --aviso:#FFB547;
  --r1:6px; --r2:12px; --r3:18px;
  --side:248px; --top:60px;
}
body.canal-en{--ac:#2EE6FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--noite);color:var(--texto);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
svg{display:block}

/* ---------- topo ---------- */
.topo{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--grafite);border-bottom:1px solid var(--linha);z-index:20}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:200px}
.marca-logo{width:34px;height:34px;border-radius:50%;background:var(--noite);display:grid;place-items:center;border:2px solid var(--ac);transition:border-color .3s}
.marca-nome{font:22px/1 Anton,sans-serif;letter-spacing:.5px}
.marca-nome em{font-style:normal;color:var(--ac);transition:color .3s}
.marca-studio{font-size:12px;color:var(--apagado);font-weight:600;margin-left:2px}
.busca{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--noite);border:1px solid var(--linha);border-radius:999px;padding:0 16px;height:40px}
.busca input{flex:1;background:none;border:0;outline:0}
.busca input::placeholder{color:var(--apagado)}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;font-weight:600;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-ac{background:var(--ac);color:var(--ac-tinta)}
.btn-ac:hover{filter:brightness(1.08)}
.btn-borda{border:1px solid var(--linha);background:var(--placa)}
.btn-borda:hover{background:var(--placa2)}
.btn-perigo{background:var(--corte);color:#fff}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.rec{width:8px;height:8px;border-radius:50%;background:var(--corte);box-shadow:0 0 0 0 rgba(255,59,78,.6)}
.rodando .rec{animation:pulso 1.2s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(255,59,78,0)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}}

/* ---------- lateral ---------- */
.lado{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:var(--grafite);border-right:1px solid var(--linha);display:flex;flex-direction:column;overflow-y:auto;z-index:10}
.perfil{padding:24px 16px 18px;text-align:center;border-bottom:1px solid var(--linha)}
.avatar-grande{width:104px;height:104px;margin:0 auto 12px;border-radius:50%;background:var(--noite);border:3px solid var(--ac);display:grid;place-items:center;position:relative;transition:border-color .3s}
.perfil small{display:block;color:var(--apagado);font-size:12px}
.perfil strong{display:block;font-size:15px;margin-top:2px}
.trocar{margin-top:14px;display:flex;background:var(--noite);border-radius:999px;padding:3px;border:1px solid var(--linha)}
.trocar button{flex:1;height:30px;border-radius:999px;font-size:12px;font-weight:700;color:var(--apagado)}
.trocar button[aria-pressed=true]{background:var(--ac);color:var(--ac-tinta)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:16px;height:44px;padding:0 16px;border-radius:var(--r1);text-decoration:none;color:#C9C9D3;font-weight:500;position:relative}
.nav a:hover{background:var(--placa)}
.nav a[aria-current=page]{background:var(--placa2);color:var(--texto)}
.nav a[aria-current=page]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ac)}
.nav a[aria-current=page] svg{color:var(--ac)}
.nav .badge{margin-left:auto;background:var(--corte);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.lado-rodape{margin-top:auto;padding:16px;border-top:1px solid var(--linha);font-size:12px;color:var(--apagado)}
.lado-rodape a{color:var(--texto)}

/* ---------- conteúdo ---------- */
main{margin-left:var(--side);padding:calc(var(--top) + 28px) 32px 60px;min-height:100%}
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font:34px/1 Anton,sans-serif;letter-spacing:.3px}
.sub{color:var(--apagado);margin-top:8px}
h2{font-size:16px;font-weight:700}
.aviso-demo{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,rgba(255,59,78,.14),transparent);border:1px solid rgba(255,59,78,.35);border-radius:var(--r2);padding:12px 16px;margin-bottom:22px}
.aviso-demo p{flex:1}

/* painel */
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.cartao{background:var(--grafite);border:1px solid var(--linha);border-radius:var(--r2);padding:20px}
.cartao h2{margin-bottom:14px}
.ultimo .thumb{border-radius:var(--r1);aspect-ratio:16/9;width:100%}
.ultimo h3{font-size:15px;font-weight:600;margin:12px 0 4px}
.linha-num{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--linha);color:#C9C9D3}
.linha-num b{color:var(--texto);font-weight:600}
.numeros{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{background:var(--placa);border-radius:var(--r1);padding:14px}
.num b{display:block;font:30px/1.05 Anton,sans-serif;letter-spacing:.5px}
.num span{color:var(--apagado);font-size:12.5px}
.num.destaque b{color:var(--ac)}
.grafico{margin-top:16px}
.barras{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px}
.barras div{flex:1;background:var(--placa2);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.barras div.hoje{background:var(--ac)}
.barras div:hover{background:var(--ac);opacity:.85}
.barras div:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translate(-50%,-6px);background:var(--texto);color:var(--noite);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.eixo{display:flex;justify-content:space-between;color:var(--apagado);font-size:11px;margin-top:6px}
.mini{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--linha)}
.mini:first-of-type{border-top:0}
.mini .ini{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--placa2);font-weight:700}
.mini p{flex:1;min-width:0}
.mini p span{display:block;color:var(--apagado);font-size:12.5px}
.mini em{font-style:normal;font-weight:700;color:var(--ac)}
.vazio{color:var(--apagado);padding:28px 8px;text-align:center}
.vazio b{display:block;color:var(--texto);font-size:15px;margin-bottom:6px}

/* abas + tabela */
.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:6px;overflow-x:auto}
.abas button{height:46px;padding:0 18px;color:var(--apagado);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.abas button[aria-selected=true]{color:var(--texto);border-color:var(--ac)}
.abas .cont{margin-left:6px;font-size:12px;color:var(--apagado)}
.tabela{width:100%;border-collapse:collapse}
.tabela th{text-align:left;font-size:12px;font-weight:600;color:var(--apagado);padding:12px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tabela td{padding:12px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tabela tr:hover td{background:var(--grafite)}
.tabela .num-col{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vid{display:flex;gap:14px;align-items:center;min-width:320px}
.vid .dur{position:relative;display:block;flex:none;width:136px}
.vid .thumb{width:100%;aspect-ratio:16/9;border-radius:var(--r1)}
.vid .dur span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.82);font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px}
.vid-txt{min-width:0}
.vid-txt strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.vid-txt small{color:var(--apagado);display:block;margin-top:3px}
.vid-acoes{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .12s}
tr:hover .vid-acoes,tr:focus-within .vid-acoes{opacity:1}
.icone-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#C9C9D3}
.icone-btn:hover{background:var(--placa2);color:var(--texto)}
.icone-btn.perigo:hover{color:var(--corte)}
.thumb{background:var(--placa2) center/cover no-repeat;display:block;position:relative;overflow:hidden}
.thumb.sem{display:grid;place-items:center;color:var(--apagado);font:22px Anton,sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--apagado)}
.chip.publico i{background:var(--ok)}
.chip.privado i{background:var(--aviso)}
.chip.agendado i{background:var(--ac)}
.chip.removido{color:var(--apagado)} .chip.removido i{background:var(--corte)}
.chip.pendente i{background:var(--ac);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.2}}
.aviso-linha{color:var(--aviso);font-size:12px;margin-top:4px}

/* fila */
.fila-item{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--linha)}
.fila-item:hover{background:var(--grafite)}
.nota{width:52px;height:52px;border-radius:var(--r1);background:var(--placa);display:grid;place-items:center;text-align:center;line-height:1}
.nota b{font:20px Anton,sans-serif;color:var(--ac)}
.nota span{font-size:10px;color:var(--apagado)}
.fila-item h3{font-size:15px;font-weight:600}
.fila-item h3 .prio{margin-left:8px;font-size:11px;font-weight:700;color:var(--ac-tinta);background:var(--ac);border-radius:4px;padding:1px 6px;vertical-align:2px}
.titulos-chat{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.titulos-chat span{background:var(--placa);border-radius:999px;padding:3px 10px;font-size:12.5px;color:#C9C9D3;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--apagado);font-size:12.5px;margin-top:3px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* streamers */
.streamers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.st{background:var(--grafite);border:1px solid var(--linha);border-radius:var(--r2);padding:18px;display:flex;flex-direction:column;gap:14px}
.st.bloq{opacity:.62}
.st-topo{display:flex;gap:12px;align-items:center}
.st-av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font:20px Anton,sans-serif;color:var(--noite)}
.st-topo p{flex:1;min-width:0}
.st-topo strong{display:block;font-size:15px}
.st-topo a{color:var(--apagado);font-size:12.5px;text-decoration:none}
.st-topo a:hover{color:var(--texto);text-decoration:underline}
.st-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.st-nums div{background:var(--placa);border-radius:var(--r1);padding:8px 4px}
.st-nums b{display:block;font:18px Anton,sans-serif}
.st-nums span{font-size:11px;color:var(--apagado)}
.st-acoes{display:flex;gap:8px;flex-wrap:wrap}
.tag-bloq{font-size:11px;font-weight:700;color:var(--corte);border:1px solid var(--corte);border-radius:4px;padding:1px 6px}
.novo-st{border-style:dashed;justify-content:center}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:12.5px;color:var(--apagado);font-weight:600}
.campo input,.campo select{height:40px;background:var(--noite);border:1px solid var(--linha);border-radius:var(--r1);padding:0 12px;outline:0}
.campo input:focus,.campo select:focus{border-color:var(--ac)}

/* configurações */
.config{max-width:720px;display:flex;flex-direction:column;gap:20px}
.config ol{padding-left:20px;display:flex;flex-direction:column;gap:6px;color:#C9C9D3}
.config code{background:var(--placa);padding:1px 6px;border-radius:4px;font-size:12.5px}
.status-ok{color:var(--ok);font-weight:600}

/* diálogo + toast */
.fundo-dialogo{position:fixed;inset:0;background:rgba(5,5,8,.72);display:none;place-items:center;z-index:50;padding:20px}
.fundo-dialogo.aberto{display:grid}
.dialogo{background:var(--placa);border:1px solid var(--linha);border-radius:var(--r3);padding:24px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;animation:entra .18s ease-out}
@keyframes entra{from{transform:translateY(8px) scale(.98);opacity:0}}
.dialogo h2{font:22px Anton,sans-serif;letter-spacing:.3px}
.dialogo p{color:#C9C9D3}
.dialogo .acoes{margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--texto);color:var(--noite);font-weight:600;padding:12px 18px;border-radius:var(--r1);opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px)}
.toast.ver{opacity:1;transform:translate(-50%,0)}

/* responsivo */
@media (max-width:1180px){.grade{grid-template-columns:1fr 1fr}.grade .cartao:first-child{grid-row:span 2}}
@media (max-width:980px){
  :root{--side:76px}
  .perfil small,.perfil strong,.trocar,.nav a span,.nav .badge,.lado-rodape{display:none}
  .avatar-grande{width:48px;height:48px;border-width:2px}
  .perfil{padding:16px 8px}
  .nav a{justify-content:center;padding:0}
  .marca{min-width:0}.marca-studio{display:none}
}
@media (max-width:720px){
  :root{--top:56px}
  .busca{display:none}
  .marca-nome{font-size:19px}
  .topo{padding:0 14px}
  .topo .btn span{display:none}
  .lado{top:auto;bottom:0;width:100%;height:64px;flex-direction:row;border-right:0;border-top:1px solid var(--linha)}
  .perfil,.lado-rodape{display:none}
  .nav{flex-direction:row;flex:1;padding:6px;justify-content:space-around}
  .nav a{flex:1;height:52px;flex-direction:column;gap:3px;justify-content:center;font-size:10.5px}
  .nav a span{display:block}
  .nav a[aria-current=page]::before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:3px}
  main{margin-left:0;padding:calc(var(--top) + 18px) 16px 96px}
  h1{font-size:28px}
  .grade{grid-template-columns:1fr}
  .grade .cartao:first-child{grid-row:auto}
  .tabela thead{display:none}
  .tabela tr{display:grid;grid-template-columns:1fr auto;padding:12px 0;border-bottom:1px solid var(--linha)}
  .tabela td{border:0;padding:4px 0}
  .tabela td:first-child{grid-column:1/-1}
  .tabela td.esconde-mob{display:none}
  .vid{min-width:0}.vid .dur{width:120px}
  .vid-acoes{opacity:1}
  .fila-item{grid-template-columns:44px 1fr}
  .fila-item .acoes{grid-column:1/-1;justify-content:flex-start}
  .nota{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topo">
  <a class="marca" href="#painel" aria-label="Início do painel">
    <span class="marca-logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 40 40"><path d="M27 9a13 13 0 1 0 0 22" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><circle cx="31" cy="9" r="4" fill="#FF3B4E"/></svg>
    </span>
    <span class="marca-nome" id="marcaNome">CORTE <em>CITY</em></span>
    <span class="marca-studio">Studio</span>
  </a>
  <label class="busca">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="busca" type="search" placeholder="Pesquisar nos vídeos e streamers" autocomplete="off">
  </label>
  <div class="topo-acoes">
    <button class="btn btn-borda" data-acao="youtube" title="Cole links de vídeos ou lives do YouTube e a máquina faz os cortes dos melhores momentos"><span>YouTube → Cortes</span></button>
    <button class="btn btn-borda" data-acao="post-x" title="Cole links de posts do X sobre GTA 6 e a máquina transforma em Short"><span>Post do X → Short</span></button>
    <button class="btn btn-ac" id="btnRodar" data-acao="rodar" title="Caça clipes e monta o próximo Short agora"><i class="rec"></i><span>Rodar agora</span></button>
  </div>
</header>

<nav class="lado" aria-label="Menu">
  <div class="perfil">
    <div class="avatar-grande" aria-hidden="true">
      <svg width="58" height="58" viewBox="0 0 40 40"><path d="M27 9a13 13 0 1 0 0 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="31" cy="9" r="3.6" fill="#FF3B4E"/></svg>
    </div>
    <small>Seu canal</small>
    <strong id="nomeCanal">Corte City</strong>
    <div class="trocar" role="group" aria-label="Trocar de canal">
      <button data-canal="br" aria-pressed="true">Corte City</button>
      <button data-canal="en" aria-pressed="false">Clip City</button>
    </div>
  </div>
  <div class="nav">
    <a href="#painel" data-rota="painel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Painel</span></a>
    <a href="#conteudo" data-rota="conteudo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg><span>Conteúdo</span><b class="badge" id="badgeRevisao" hidden></b></a>
    <a href="#fila" data-rota="fila"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Fila</span></a>
    <a href="#streamers" data-rota="streamers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.5 3.5 5.2"/></svg><span>Streamers</span></a>
    <a href="#ajustes" data-rota="ajustes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Configurações</span></a>
  </div>
  <div class="lado-rodape" id="rodape">Carregando…</div>
</nav>

<main id="conteudo" tabindex="-1"></main>

<div class="fundo-dialogo" id="fundoDialogo" role="dialog" aria-modal="true" aria-labelledby="dlgTitulo">
  <div class="dialogo" id="dialogo"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const REPO = "amiraldopedro/corte-city-maquina";
const CANAIS = {br: {nome: "Corte City", p1: "CORTE", p2: "CITY", yt: "@cortecity", fuso: "America/Sao_Paulo"},
                en: {nome: "Clip City", p1: "CLIP", p2: "CITY", yt: "@theclipcit", fuso: "America/New_York"}};
const CORES = ["#C8FF2E", "#2EE6FF", "#FF3B4E", "#FFB547", "#B794FF", "#5CF2A8", "#FF7AC6"];
const S = {canal: guardar("cc_canal") || "br", dados: {br: {momentos: {}}, en: {momentos: {}}}, cfg: null,
           demo: false, aba: "revisar", busca: "", pendentes: {}, thumbs: {}, carregadoEm: null, erro: null};

/* ---------- utilidades ---------- */
function guardar(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " mi" : n >= 1e4 ? Math.round(n / 1e3) + " mil" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".", ",") + " mil" : String(n ?? 0);
const inicial = s => (s || "?").trim().charAt(0).toUpperCase();
function corDe(s) { let h = 0; for (const c of s || "") h = (h * 31 + c.charCodeAt(0)) >>> 0; return CORES[h % CORES.length]; }
function quando(iso) {
  if (!iso) return "—";
  const d = new Date(iso), agora = new Date(), dif = (agora - d) / 1000;
  if (dif >= 0 && dif < 3600) return `há ${Math.max(1, Math.round(dif / 60))} min`;
  if (dif >= 0 && dif < 86400) return `há ${Math.round(dif / 3600)} h`;
  return d.toLocaleDateString("pt-BR", {day: "2-digit", month: "short"}) + " " + d.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("ver"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("ver"), 3800); }

/* ---------- GitHub ---------- */
const token = () => guardar("cc_token");
async function gh(caminho, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/${caminho}`, {...opts,
    headers: {Authorization: "Bearer " + token(), Accept: opts.accept || "application/vnd.github+json", ...(opts.headers || {})}});
  return r;
}
async function lerArquivo(caminho, tipo = "texto") {
  const r = await gh(`contents/${caminho}?ref=main&t=${Date.now()}`, {accept: "application/vnd.github.raw+json"});
  if (r.status === 404) return null;
  if (r.status === 401 || r.status === 403) throw new Error("token");
  if (!r.ok) throw new Error("http " + r.status);
  return tipo === "blob" ? r.blob() : r.text();
}
async function disparar(workflow, inputs) {
  if (S.demo) { toast("Modo demonstração: conecte seu token em Configurações para os botões funcionarem."); return false; }
  const r = await gh(`actions/workflows/${workflow}/dispatches`, {method: "POST", body: JSON.stringify({ref: "main", inputs})});
  if (r.status === 204) return true;
  toast(r.status === 403 || r.status === 404 ? "O token não tem permissão de Actions (leitura e escrita)." : "O GitHub recusou o pedido (" + r.status + ").");
  return false;
}

async function carregar() {
  S.erro = null;
  if (!token()) { S.demo = true; montarDemo(); desenhar(); return; }
  S.demo = false;
  try {
    const [cfg, br, en] = await Promise.all([lerArquivo("config.yaml"), lerArquivo("estado/br.json"), lerArquivo("estado/en.json")]);
    S.cfg = cfg ? jsyaml.load(cfg) : {canais: [], bloqueados: []};
    S.dados.br = br ? JSON.parse(br) : {momentos: {}};
    S.dados.en = en ? JSON.parse(en) : {momentos: {}};
    S.carregadoEm = new Date();
  } catch (e) {
    S.erro = e.message === "token" ? "O token não abriu o repositório. Confira se ele dá acesso ao corte-city-maquina." : "Não consegui ler os dados agora. Tente atualizar em instantes.";
    S.demo = true; montarDemo();
  }
  desenhar();
}

async function thumbDe(m) {
  if (S.demo) return null;
  if (m.id in S.thumbs) return S.thumbs[m.id];
  S.thumbs[m.id] = null;
  try { const b = await lerArquivo(`estado/thumbs/${m.id}.jpg`, "blob"); if (b) S.thumbs[m.id] = URL.createObjectURL(b); } catch (e) {}
  return S.thumbs[m.id];
}
function pintarThumbs() {
  document.querySelectorAll("[data-thumb]").forEach(async el => {
    const id = el.dataset.thumb, m = momentos().find(x => x.id === id) || todos().find(x => x.id === id);
    if (!m) return;
    if (S.demo) { el.style.backgroundImage = `url("${thumbDemo(m)}")`; el.classList.remove("sem"); el.textContent = ""; return; }
    const url = await thumbDe(m);
    if (url) { el.style.backgroundImage = `url("${url}")`; el.classList.remove("sem"); el.textContent = ""; }
  });
}

/* ---------- dados derivados ---------- */
const todos = () => Object.values(S.dados[S.canal].momentos || {});
const momentos = () => todos();
const cfgCanal = () => (S.cfg?.canais || []).find(c => c.id === S.canal) || {streamers: []};
const bloqueados = () => (S.cfg?.bloqueados || []).map(x => String(x).toLowerCase());
function visibilidade(m) {
  if (S.pendentes[m.id]) return {cls: "pendente", txt: S.pendentes[m.id]};
  if (m.status === "removido" || m.status === "descartado") return {cls: "removido", txt: "Removido"};
  if (m.status === "pronto") return {cls: "privado", txt: "Pronto pra postar"};
  if (m.privacidade === "private") return {cls: "agendado", txt: "Postado · privado/agendado"};
  return {cls: "publico", txt: "Postado"};
}
const dataDe = m => m.postado_em || m.feito_em;
const postados = tipo => todos().filter(m => ["pronto", "postado"].includes(m.status) || (m.status === "removido" && m.youtube_id))
  .filter(m => tipo === "short" ? ["short", "noticia"].includes(m.tipo || "short") : ["dia", "top10", "longo", "serie", "narrado"].includes(m.tipo))
  .sort((a, b) => (dataDe(b) || "").localeCompare(dataDe(a) || ""));
const aRevisar = () => postados("short").concat(postados("comp")).filter(m => m.status === "pronto").sort((a, b) => (dataDe(a) || "").localeCompare(dataDe(b) || ""));
const fila = () => todos().filter(m => m.status === "novo").sort((a, b) => (!!b.prioridade - !!a.prioridade) || (b.score - a.score));
const nomeDe = login => (cfgCanal().streamers || []).find(s => s.login === login)?.nome || login;
const filtra = lista => !S.busca ? lista : lista.filter(m => [m.titulo, m.nome, nomeDe(m.streamer), m.streamer, ...(m.titulos_chat || [])].join(" ").toLowerCase().includes(S.busca));

/* ---------- desenho ---------- */
function desenhar() {
  document.body.classList.toggle("canal-en", S.canal === "en");
  const c = CANAIS[S.canal];
  $("#marcaNome").innerHTML = `${c.p1} <em>${c.p2}</em>`;
  $("#nomeCanal").textContent = c.nome;
  document.title = c.nome + " Studio";
  document.querySelectorAll(".trocar button").forEach(b => b.setAttribute("aria-pressed", b.dataset.canal === S.canal));
  const rota = (location.hash || "#painel").slice(1);
  document.querySelectorAll(".nav a").forEach(a => a.dataset.rota === rota ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const rev = aRevisar().length, badge = $("#badgeRevisao");
  badge.hidden = !rev; badge.textContent = rev;
  $("#rodape").innerHTML = S.demo ? `Mostrando exemplo.<br><a href="#ajustes">Conectar dados reais</a>` :
    `Atualizado ${quando(S.carregadoEm?.toISOString())}<br><a href="https://github.com/${REPO}/actions" target="_blank" rel="noopener">Ver a máquina trabalhando</a>`;
  const telas = {painel: telaPainel, conteudo: telaConteudo, fila: telaFila, streamers: telaStreamers, ajustes: telaAjustes};
  const main = $("#conteudo");
  main.innerHTML = (S.demo && rota !== "ajustes" ? avisoDemo() : "") + (telas[rota] || telaPainel)();
  pintarThumbs();
}

function avisoDemo() {
  return `<div class="aviso-demo"><i class="rec"></i><p>${S.erro ? esc(S.erro) : "Você está vendo dados de exemplo. Conecte seu token do GitHub para ver os vídeos reais e usar os botões."}</p><a class="btn btn-borda btn-sm" href="#ajustes">Conectar</a></div>`;
}

function cabeca(titulo, sub, direita = "") {
  return `<div class="cabeca"><div><h1>${titulo}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>${direita}</div>`;
}

/* PAINEL */
function telaPainel() {
  const shorts = postados("short"), ultimo = aRevisar()[0] || shorts[0];
  const mes = Date.now() - 28 * 864e5;
  const recentes = postados("short").concat(postados("comp")).filter(m => m.status === "postado" && new Date(dataDe(m)) > mes);
  const views28 = recentes.reduce((s, m) => s + (m.views || 0), 0);
  const likes28 = recentes.reduce((s, m) => s + (m.likes || 0), 0);
  // views por dia de postagem (14 dias)
  const dias = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d; });
  const porDia = dias.map(d => recentes.filter(m => { const p = new Date(m.postado_em); p.setHours(0, 0, 0, 0); return +p === +d; }).reduce((s, m) => s + (m.views || 0), 0));
  const max = Math.max(1, ...porDia);
  const ranking = Object.values(shorts.reduce((acc, m) => { const k = m.streamer; acc[k] = acc[k] || {login: k, views: 0, n: 0}; acc[k].views += m.views || 0; acc[k].n++; return acc; }, {}))
    .sort((a, b) => b.views - a.views).slice(0, 5);
  const proximos = fila().slice(0, 4);

  return cabeca("Painel do canal", `${CANAIS[S.canal].yt} · ${modoTxt()}`) + `
  <div class="grade">
    <section class="cartao ultimo">
      <h2>${ultimo && ultimo.status === "pronto" ? "Próximo pra postar" : "Último Short"}</h2>
      ${ultimo ? `
        <span class="thumb sem" data-thumb="${ultimo.id}">${inicial(nomeDe(ultimo.streamer))}</span>
        <h3>${esc(ultimo.titulo)}</h3>
        <p class="meta">${esc(nomeDe(ultimo.streamer))} · ${quando(dataDe(ultimo))}</p>
        <div style="margin-top:12px">
          <div class="linha-num"><span>Visualizações</span><b>${fmt(ultimo.views || 0)}</b></div>
          <div class="linha-num"><span>Curtidas</span><b>${fmt(ultimo.likes || 0)}</b></div>
          <div class="linha-num"><span>Situação</span><span class="chip ${visibilidade(ultimo).cls}"><i></i>${visibilidade(ultimo).txt}</span></div>
        </div>
        <div class="acoes" style="justify-content:flex-start;margin-top:14px">
          ${ultimo.status === "pronto" ? botoesPostar(ultimo, true) : ""}
          <a class="btn btn-borda btn-sm" href="#conteudo">Ver todos os vídeos</a>
        </div>` : vazio("Nenhum Short ainda", "Assim que a máquina postar o primeiro, ele aparece aqui.")}
    </section>
    <section class="cartao">
      <h2>Números do canal</h2>
      <div class="numeros">
        <div class="num destaque"><b>${fmt(views28)}</b><span>views em 28 dias</span></div>
        <div class="num"><b>${fmt(likes28)}</b><span>curtidas em 28 dias</span></div>
        <div class="num"><b>${shorts.length}</b><span>Shorts feitos</span></div>
        <div class="num"><b>${aRevisar().length}</b><span>prontos pra postar</span></div>
      </div>
      <div class="grafico">
        <p class="meta">Views dos vídeos postados (cole o link em “Já postei” para contar)</p>
        <div class="barras">${porDia.map((v, i) => `<div style="height:${Math.round(v / max * 100)}%" class="${i === 13 ? "hoje" : ""}" data-v="${fmt(v)} views · ${dias[i].toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"})}"></div>`).join("")}</div>
        <div class="eixo"><span>${dias[0].toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"})}</span><span>hoje</span></div>
      </div>
    </section>
    <section class="cartao">
      <h2>Streamers que mais rendem</h2>
      ${ranking.length ? ranking.map(r => `<div class="mini"><span class="ini" style="background:${corDe(r.login)};color:var(--noite)">${inicial(nomeDe(r.login))}</span><p><b>${esc(nomeDe(r.login))}</b><span>${r.n} Short${r.n > 1 ? "s" : ""}</span></p><em>${fmt(r.views)}</em></div>`).join("") : vazio("Sem dados ainda", "O ranking aparece depois dos primeiros vídeos.")}
      <h2 style="margin-top:22px">Próximos da fila</h2>
      ${proximos.length ? proximos.map(m => `<div class="mini"><span class="ini">${m.n_clipes}</span><p><b>${esc(nomeDe(m.streamer))}</b><span>${esc(tituloChat(m))}</span></p></div>`).join("") + `<a class="btn btn-borda btn-sm" style="margin-top:10px" href="#fila">Abrir a fila</a>` : vazio("Fila vazia", "A máquina procura clipes novos a cada 4 horas.")}
    </section>
  </div>`;
}

/* CONTEÚDO */
function telaConteudo() {
  const listas = {revisar: aRevisar(), shorts: postados("short"), comp: postados("comp")};
  const lista = filtra(listas[S.aba]);
  const aba = (id, nome) => `<button role="tab" aria-selected="${S.aba === id}" data-aba="${id}">${nome}<span class="cont">${listas[id].length}</span></button>`;
  return cabeca("Conteúdo do canal", "Baixe o vídeo, copie título e descrição, poste pelo app do YouTube e aperte “Já postei”.") + `
  <div class="abas" role="tablist">${aba("revisar", "Prontos pra postar")}${aba("shorts", "Shorts")}${aba("comp", "Compilados")}</div>
  ${lista.length ? `<table class="tabela"><thead><tr><th>Vídeo</th><th>Visibilidade</th><th class="esconde-mob">Data</th><th class="num-col">Views</th><th class="num-col esconde-mob">Curtidas</th></tr></thead><tbody>
    ${lista.map(linhaVideo).join("")}</tbody></table>` :
    vazio(S.busca ? "Nada encontrado" : S.aba === "revisar" ? "Nada pra postar agora" : "Nenhum vídeo aqui ainda",
          S.busca ? "Tente outro nome ou palavra." : S.aba === "revisar" ? "Quando a máquina terminar um vídeo, ele aparece aqui pronto pra você postar." : "Os vídeos aparecem aqui assim que a máquina fizer.")}`;
}
function linhaVideo(m) {
  const v = visibilidade(m), nome = m.tipo === "short" || !m.tipo ? nomeDe(m.streamer) : (m.streamers || []).map(nomeDe).slice(0, 3).join(", ");
  const dur = m.duracao ? `0:${String(Math.round(m.duracao)).padStart(2, "0")}` : m.tipo === "top10" ? "TOP 10" : m.tipo === "dia" ? "LONGO" : "";
  return `<tr>
    <td><div class="vid">
      <a class="dur" href="${m.status === "pronto" ? esc(m.video_url || "#") : ytLink(m)}" target="_blank" rel="noopener" aria-label="${m.status === "pronto" ? "Baixar vídeo" : "Abrir no YouTube"}"><span class="thumb sem" data-thumb="${m.id}">${inicial(nome)}</span>${dur ? `<span>${dur}</span>` : ""}</a>
      <div class="vid-txt"><strong>${esc(m.titulo || "Sem título")}</strong><small>${esc(nome)}</small>
        ${m.aviso ? `<p class="aviso-linha">${esc(m.aviso)}</p>` : ""}
        ${m.status === "pronto" ? `<div class="acoes" style="justify-content:flex-start;margin-top:8px">${botoesPostar(m)}</div>` : `<div class="vid-acoes">
          ${m.youtube_id ? `<a class="icone-btn" title="Abrir no YouTube Studio" aria-label="Abrir no YouTube Studio" href="https://studio.youtube.com/video/${m.youtube_id}/edit" target="_blank" rel="noopener">${ic.lapis}</a>
          <a class="icone-btn" title="Ver no YouTube" aria-label="Ver no YouTube" href="${ytLink(m)}" target="_blank" rel="noopener">${ic.olho}</a>` : `<button class="btn btn-borda btn-sm" data-acao="postei" data-id="${m.id}">Colar link do YouTube</button>`}
          ${m.status === "postado" && m.youtube_id ? `<button class="icone-btn perigo" title="Apagar do YouTube" aria-label="Apagar do YouTube" data-acao="descartar" data-id="${m.id}">${ic.lixo}</button>` : ""}
        </div>`}
      </div></div></td>
    <td><span class="chip ${v.cls}"><i></i>${v.txt}</span></td>
    <td class="esconde-mob">${quando(dataDe(m))}</td>
    <td class="num-col">${fmt(m.views || 0)}</td>
    <td class="num-col esconde-mob">${fmt(m.likes || 0)}</td></tr>`;
}

/* FILA */
function tituloChat(m) { return (m.titulos_chat || []).find(t => t && t.length > 3) || "sem título do público"; }
function telaFila() {
  const lista = filtra(fila());
  return cabeca("Fila de momentos", "Trechos que o público clipou e que ainda viram vídeo. A nota mistura quantas pessoas cliparam e as views.",
    `<button class="btn btn-ac" data-acao="rodar"><i class="rec"></i>Fazer o próximo agora</button>`) +
  (lista.length ? `<div>${lista.map(m => {
    const n = Math.min(99, Math.round(Math.log10((m.score || 1) + 1) * 20));
    return `<article class="fila-item">
      <div class="nota" title="Nota do momento"><span><b>${n}</b><br>nota</span></div>
      <div><h3>${esc(nomeDe(m.streamer))}${m.prioridade ? `<span class="prio">próximo</span>` : ""}</h3>
        <p class="meta">${m.n_clipes} clipe${m.n_clipes > 1 ? "s" : ""} do mesmo momento · ${fmt(m.views)} views nos clipes · ${quando(m.criado_em)}${m.video_id ? "" : " · sem a live gravada"}</p>
        <div class="titulos-chat">${(m.titulos_chat || []).filter(Boolean).slice(0, 4).map(t => `<span title="${esc(t)}">${esc(t)}</span>`).join("")}</div></div>
      <div class="acoes">
        ${m.clipe_url ? `<a class="btn btn-borda btn-sm" href="${esc(m.clipe_url)}" target="_blank" rel="noopener">Ver clipe</a>` : ""}
        ${m.prioridade ? "" : `<button class="btn btn-borda btn-sm" data-acao="priorizar" data-id="${m.id}">Fazer este primeiro</button>`}
        <button class="btn btn-borda btn-sm" data-acao="descartar-fila" data-id="${m.id}">Descartar</button>
      </div></article>`;
  }).join("")}</div>` : vazio(S.busca ? "Nada encontrado" : "A fila está vazia", S.busca ? "Tente outro nome." : "A máquina procura clipes novos a cada 4 horas. Use “Fazer o próximo agora” para procurar já."));
}

/* STREAMERS */
function telaStreamers() {
  const lista = (cfgCanal().streamers || []).filter(s => !S.busca || (s.nome + s.login).toLowerCase().includes(S.busca));
  const bloq = bloqueados(), shorts = postados("short");
  return cabeca("Streamers", `Quem o ${CANAIS[S.canal].nome} corta. Bloquear faz a máquina parar de usar os vídeos da pessoa.`) + `
  <div class="streamers">
    ${lista.map(s => {
      const b = bloq.includes(s.login), meus = shorts.filter(m => m.streamer === s.login), v = meus.reduce((t, m) => t + (m.views || 0), 0);
      const naFila = fila().filter(m => m.streamer === s.login).length;
      return `<article class="st ${b ? "bloq" : ""}">
        <div class="st-topo"><span class="st-av" style="background:${corDe(s.login)}">${inicial(s.nome)}</span>
          <p><strong>${esc(s.nome)}</strong><a href="https://twitch.tv/${esc(s.login)}" target="_blank" rel="noopener">twitch.tv/${esc(s.login)}</a></p>

async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); return true; } catch (e) {
    const t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} t.remove(); return ok;
  }
}
